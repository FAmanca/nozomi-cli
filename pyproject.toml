[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nozomi-cli"
version = "0.2.0"
description = "CLI untuk streaming anime subtitle Indonesia ala ani-cli"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "InquirerPy>=0.3.4",
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.scripts]
nozomi-cli = "main:start"

[tool.setuptools]
py-modules = ["main", "api", "config", "history"]
